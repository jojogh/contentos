<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px;
    background:#0D0F12;
    font-family:"Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:#F2F3F5;
    position:relative;
    overflow:hidden;
  }
  .grid-lines {
    position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:78px 78px;
  }
  .pad { position:absolute; left:72px; right:72px; top:80px; bottom:80px; }
  .eyebrow {
    font-family:Inter,"SF Mono",monospace; font-size:20px; letter-spacing:6px;
    color:#9BA0A8; text-transform:uppercase;
    display:flex; align-items:center; gap:16px;
  }
  .eyebrow::before { content:""; width:40px; height:1px; background:#C8F04A; }
  .main { margin-top:150px; position:relative; }
  .big-number {
    font-family:Inter,"Source Han Sans SC",sans-serif;
    font-size:380px; font-weight:700; line-height:0.9;
    color:#C8F04A;
    letter-spacing:-10px;
  }
  .big-unit {
    font-size:92px; font-weight:700; color:#F2F3F5;
    margin-top:4px; letter-spacing:6px;
  }
  .headline {
    margin-top:44px;
    font-size:78px; font-weight:700; line-height:1.28;
    letter-spacing:1px;
    max-width:860px;
  }
  .headline .dim { color:#9BA0A8; }
  .sub {
    margin-top:40px;
    font-size:30px; color:#9BA0A8; line-height:1.72;
    max-width:790px;
  }
  .sub b { color:#F2F3F5; font-weight:600; }
  .matrix {
    position:absolute; right:0; top:8px;
    width:300px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:9px;
  }
  .cell {
    height:64px;
    border:1px solid rgba(255,255,255,0.07);
    border-radius:8px;
    background:rgba(255,255,255,0.012);
  }
  .cell.hit {
    border-color:#C8F04A;
    background:rgba(200,240,74,0.10);
    box-shadow:0 0 26px rgba(200,240,74,0.12);
  }
  .tags {
    position:absolute; bottom:0; left:0;
    display:flex; gap:16px;
  }
  .tag {
    border:1px solid #2A2E35; border-radius:999px;
    padding:12px 28px; font-size:24px; color:#9BA0A8;
  }
  .tag.hot { border-color:#C8F04A; color:#C8F04A; }
  .pageno {
    position:absolute; bottom:80px; right:72px;
    font-family:Inter,monospace; font-size:18px;
    color:#4A4F57; letter-spacing:2px;
  }
</style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="pad">
    <div class="eyebrow">COMPETITOR ANALYSIS · 选品方法</div>
    <div class="main">
      <div class="big-number">20</div>
      <div class="big-unit">条差评</div>
      <div class="headline">比一份竞品报告<br><span class="dim">更能决定下一版做什么</span></div>
      <div class="sub">先把最近 20 条评论按星级摊开，只盯差评和中评里的高频抱怨。<b>竞品分析的第一步，不是看它有什么，而是看用户在骂什么。</b></div>
      <div class="matrix">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell hit"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </div>
    <div class="tags">
      <div class="tag hot">三张表</div>
      <div class="tag">附判断顺序</div>
    </div>
  </div>
  <div class="pageno">01 / 07</div>
</body>
</html>
